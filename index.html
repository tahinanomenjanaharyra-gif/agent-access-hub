<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Agent Access Hub — Suivi IT & Accès</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Supabase Client JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#12203D;
  --ink-2:#1B2E52;
  --ink-3:#26375E;
  --paper:#F3F5FA;
  --card:#FFFFFF;
  --amber:#E8A33D;
  --amber-deep:#C97F1D;
  --teal:#1F9D6F;
  --teal-deep:#167A56;
  --red:#D64545;
  --red-deep:#B23434;
  --slate-900:#161B26;
  --slate-700:#3A4257;
  --slate-500:#6B7386;
  --slate-300:#C7CCDA;
  --border:#E3E6EE;
  --radius:14px;
  --shadow: 0 1px 2px rgba(18,32,61,.06), 0 8px 24px -12px rgba(18,32,61,.18);
  --rail-w: 84px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--slate-900);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--amber);color:var(--ink);}

/* ===== LAYOUT ===== */
#app{display:flex;height:100vh;width:100vw;}

/* RAIL NAV */
#rail{
  width:var(--rail-w);
  flex-shrink:0;
  background:linear-gradient(180deg,var(--ink) 0%, var(--ink-2) 100%);
  display:flex;flex-direction:column;align-items:center;
  padding:18px 0;
  gap:6px;
  z-index:20;
}
.rail-logo{
  width:44px;height:44px;border-radius:12px;
  background:var(--amber);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:700;color:var(--ink);font-size:18px;
  margin-bottom:22px;
  box-shadow:0 4px 10px rgba(232,163,61,.35);
}
.rail-btn{
  width:60px;
  padding:9px 2px 8px;
  border:none;background:transparent;color:#AEB9D6;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  border-radius:12px;
  font-size:10.5px;font-weight:600;letter-spacing:.2px;
  transition:.15s;
  position:relative;
}
.rail-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
.rail-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
.rail-btn.active{background:rgba(232,163,61,.16);color:var(--amber);}
.rail-btn.active svg{stroke:var(--amber);}
.rail-badge{
  position:absolute;top:2px;right:8px;
  background:var(--red);color:#fff;font-size:9px;font-weight:700;
  min-width:16px;height:16px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
  font-family:'Inter';
}
.rail-spacer{flex:1;}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;}
#topbar{
  height:64px;flex-shrink:0;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 24px;gap:16px;
  z-index:10;
}
#topbar h1{font-size:19px;margin:0;font-weight:600;letter-spacing:-.2px;}
#topbar .sub{color:var(--slate-500);font-size:13px;margin-top:1px;}
.search-wrap{margin-left:auto;position:relative;width:320px;}
.search-wrap input{
  width:100%;padding:10px 14px 10px 38px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--paper);font-size:14px;outline:none;transition:.15s;
}
.search-wrap input:focus{border-color:var(--amber);background:#fff;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--slate-500);fill:none;stroke-width:2;}
#search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border-radius:12px;
  box-shadow:var(--shadow);border:1px solid var(--border);max-height:340px;overflow:auto;display:none;z-index:50;
}
#search-results.show{display:block;}
.sr-item{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover{background:var(--paper);}
.sr-name{font-weight:600;font-size:13.5px;}
.sr-meta{font-size:12px;color:var(--slate-500);}

#content{flex:1;overflow:auto;padding:24px 28px 60px;}

/* CARDS / GENERIC */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);}
.grid{display:grid;gap:16px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:22px;}
.kpi{
  padding:18px 20px;border-radius:var(--radius);position:relative;overflow:hidden;
  color:#fff;box-shadow:var(--shadow);
}
.kpi.k-amber{background:linear-gradient(135deg,#E8A33D,#C97F1D);}
.kpi.k-red{background:linear-gradient(135deg,#E4635A,#B23434);}
.kpi.k-teal{background:linear-gradient(135deg,#2CB587,#167A56);}
.kpi.k-ink{background:linear-gradient(135deg,#26375E,#12203D);}
.kpi .kpi-num{font-family:'Space Grotesk';font-size:32px;font-weight:700;line-height:1;}
.kpi .kpi-label{font-size:12.5px;opacity:.9;margin-top:6px;font-weight:600;}
.kpi svg{position:absolute;right:12px;top:12px;width:34px;height:34px;opacity:.25;stroke:#fff;fill:none;stroke-width:1.6;}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px;}
.section-title h2{font-size:16px;margin:0;font-weight:600;}
.section-title .count{color:var(--slate-500);font-weight:500;font-size:13px;}

/* TICKET STUB CARD — signature element */
.stub{
  background:#fff;border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow);
  padding:16px 18px;position:relative;display:flex;flex-direction:column;gap:10px;
  border-left:5px solid var(--amber);
}
.stub.stub-red{border-left-color:var(--red);}
.stub.stub-teal{border-left-color:var(--teal);}
.stub::before,.stub::after{
  content:"";position:absolute;width:14px;height:14px;background:var(--paper);border-radius:50%;
  top:50%;transform:translateY(-50%);border:1px solid var(--border);
}
.stub::before{left:-8px;}
.stub::after{right:-8px;}
.stub-perf{
  border-top:2px dashed var(--border);margin:2px -18px 0;
}
.stub-head{display:flex;align-items:center;justify-content:space-between;}
.stub-tool{font-weight:700;font-family:'Space Grotesk';font-size:14.5px;}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;
}
.tag-amber{background:#FCEED9;color:var(--amber-deep);}
.tag-red{background:#FBE1DF;color:var(--red-deep);}
.tag-teal{background:#DCF3E9;color:var(--teal-deep);}
.tag-slate{background:#EAEDF4;color:var(--slate-700);}
.stub-body{font-size:12.8px;color:var(--slate-700);display:flex;flex-wrap:wrap;gap:6px 16px;}
.stub-body b{color:var(--slate-900);}
.stub-agents{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;}
.stub-foot{display:flex;gap:8px;margin-top:2px;}

/* BUTTONS */
.btn{
  border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap;
}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:var(--ink-3);}
.btn-amber{background:var(--amber);color:var(--ink);}
.btn-amber:hover{background:var(--amber-deep);color:#fff;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-teal:hover{background:var(--teal-deep);}
.btn-red{background:var(--red);color:#fff;}
.btn-red:hover{background:var(--red-deep);}
.btn-ghost{background:var(--paper);color:var(--slate-700);border:1px solid var(--border);}
.btn-ghost:hover{background:#EAEDF4;}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--slate-700);flex-shrink:0;
}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
.icon-btn:hover{background:var(--paper);}
.icon-btn.danger:hover{background:#FBE1DF;color:var(--red-deep);border-color:#F3C2BE;}

/* TABLE */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:left;padding:11px 14px;background:var(--paper);color:var(--slate-500);
  font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;
  position:sticky;top:0;
}
thead th:first-child{border-radius:10px 0 0 10px;}
thead th:last-child{border-radius:0 10px 10px 0;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFD;}
.table-wrap{overflow:auto;border-radius:var(--radius);}
.empty-state{
  text-align:center;padding:50px 20px;color:var(--slate-500);
}
.empty-state svg{width:46px;height:46px;stroke:var(--slate-300);fill:none;stroke-width:1.4;margin-bottom:10px;}
.empty-state .es-title{font-weight:600;color:var(--slate-700);font-size:14.5px;margin-bottom:3px;}

/* FORMS */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12.5px;font-weight:600;color:var(--slate-700);}
.field input,.field select,.field textarea{
  padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;outline:none;
  background:#fff;transition:.15s;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber);}
.field textarea{resize:vertical;min-height:64px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.form-grid .full{grid-column:1/-1;}
.field-hint{font-size:11.5px;color:var(--slate-500);}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(18,32,61,.45);backdrop-filter:blur(2px);
  display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow:auto;
}
.modal-overlay.show{display:flex;}
.modal{
  background:#fff;border-radius:18px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(18,32,61,.3);
  animation:modalIn .18s ease;margin-bottom:40px;
}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.modal.wide{max-width:900px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:17px;font-weight:600;}
.modal-body{padding:22px 24px;max-height:65vh;overflow:auto;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;background:var(--paper);display:flex;align-items:center;justify-content:center;}
.modal-close svg{width:16px;height:16px;stroke:var(--slate-700);}

/* TABS */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
.tabbtn{padding:10px 16px;border:none;background:transparent;font-weight:600;font-size:13.5px;color:var(--slate-500);border-bottom:2.5px solid transparent;margin-bottom:-1px;}
.tabbtn.active{color:var(--ink);border-color:var(--amber);}

/* PASSWORD STATUS PILL */
.pw-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;}
.pw-dot{width:8px;height:8px;border-radius:50%;}
.pw-green{background:#DCF3E9;color:var(--teal-deep);}.pw-green .pw-dot{background:var(--teal);}
.pw-orange{background:#FCEED9;color:var(--amber-deep);}.pw-orange .pw-dot{background:var(--amber);}
.pw-red{background:#FBE1DF;color:var(--red-deep);}.pw-red .pw-dot{background:var(--red);}
.pw-gray{background:#EAEDF4;color:var(--slate-700);}.pw-gray .pw-dot{background:var(--slate-300);}

/* AGENT PICKER */
.agent-picker{border:1.5px solid var(--border);border-radius:12px;padding:10px;max-height:260px;overflow:auto;}
.ap-search{margin-bottom:8px;}
.ap-row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;}
.ap-row:hover{background:var(--paper);}
.ap-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--amber);}
.ap-name{font-weight:600;font-size:13px;}
.ap-mat{font-size:11.5px;color:var(--slate-500);}
.selected-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.selected-chips .chip{display:flex;align-items:center;gap:6px;background:#EAF3EE;border-color:#CFE7DA;}
.selected-chips .chip button{border:none;background:none;color:var(--slate-500);font-size:14px;line-height:1;padding:0;}

/* RECAP TABLE */
.recap-table{width:100%;border-collapse:collapse;font-size:12.8px;}
.recap-table th{background:var(--ink);color:#fff;padding:9px 10px;text-align:left;font-weight:600;}
.recap-table td{padding:9px 10px;border-bottom:1px solid var(--border);}
.recap-table tr:nth-child(even) td{background:#FAFBFD;}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.toolbar .spacer{flex:1;}
.filter-select{padding:9px 12px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;}
.filter-search{position:relative;}
.filter-search input{padding:9px 12px 9px 34px;border-radius:9px;border:1.5px solid var(--border);font-size:13px;width:220px;}
.filter-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--slate-500);fill:none;stroke-width:2;}

/* BANNER ALERTS */
.banner{
  display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;margin-bottom:18px;font-size:13.5px;font-weight:600;
}
.banner svg{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;}
.banner-amber{background:#FCEED9;color:var(--amber-deep);border:1px solid #F2D6A6;}
.banner-red{background:#FBE1DF;color:var(--red-deep);border:1px solid #F3C2BE;}
.banner a,.banner .link{text-decoration:underline;cursor:pointer;}

/* TOAST */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;
  box-shadow:0 10px 30px rgba(18,32,61,.35);opacity:0;pointer-events:none;transition:.25s;z-index:200;
  display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast svg{width:16px;height:16px;stroke:var(--teal);fill:none;stroke-width:2.4;}

/* AGENT DETAIL */
.agent-hero{display:flex;gap:16px;align-items:center;padding:20px;background:linear-gradient(135deg,var(--ink),var(--ink-2));border-radius:var(--radius);color:#fff;margin-bottom:20px;}
.agent-avatar{width:56px;height:56px;border-radius:16px;background:var(--amber);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:20px;flex-shrink:0;}
.agent-hero-info h2{margin:0 0 3px;font-size:18px;}
.agent-hero-info div{font-size:12.8px;opacity:.85;}
.cause-bars{display:flex;gap:16px;margin-bottom:16px;}
.cause-bar{flex:1;background:#fff;border-radius:12px;border:1px solid var(--border);padding:16px;}
.cause-bar .cb-num{font-family:'Space Grotesk';font-size:26px;font-weight:700;}
.cause-bar .cb-label{font-size:12px;color:var(--slate-500);font-weight:600;margin-top:2px;}

/* RESPONSIVE / TABLET */
@media (max-width:980px){
  .form-grid{grid-template-columns:1fr;}
  .search-wrap{width:220px;}
  .kpis{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:700px){
  :root{--rail-w:64px;}
  .rail-btn{width:48px;font-size:9px;}
  .rail-logo{width:36px;height:36px;font-size:15px;}
  #content{padding:16px;}
  .kpis{grid-template-columns:1fr;}
  .search-wrap{display:none;}
}
.hidden{display:none !important;}
.text-red{color:var(--red-deep);}
.text-teal{color:var(--teal-deep);}
.text-amber{color:var(--amber-deep);}
.text-slate{color:var(--slate-500);}
.small{font-size:12px;}
.mt0{margin-top:0;}
.flex{display:flex;}
.gap8{gap:8px;}
.items-center{align-items:center;}
.w-full{width:100%;}
a{color:inherit;}
</style>
</head>
<body>
<div id="app">
  <nav id="rail"></nav>
  <div id="main">
    <div id="topbar">
      <div>
        <h1 id="view-title">Tableau de bord</h1>
        <div class="sub" id="view-sub">Vue d'ensemble des accès et tickets</div>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="global-search" placeholder="Rechercher un matricule ou un nom…" autocomplete="off">
        <div id="search-results"></div>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>
<div id="toast"></div>

<script>
/* =========================================================
   AGENT ACCESS HUB — Application de suivi IT & accès agents
   Stockage : Supabase + Fallback Storage Local
   ========================================================= */

/* ---------- CONFIGURATION SUPABASE ---------- */
const SUPABASE_URL = 'https://TON-PROJET.supabase.co';
const SUPABASE_ANON_KEY = 'TA_CLE_ANON';
let supabase = null;

if (typeof supabase !== 'undefined' && SUPABASE_URL !== 'https://TON-PROJET.supabase.co') {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- STORAGE HELPERS ---------- */
async function storageGet(key, fallback){
  if (supabase) {
    try {
      const { data, error } = await supabase.from('app_data').select('value').eq('key', key).single();
      if (data && !error) return JSON.parse(data.value);
    } catch(e) {
      console.warn('Supabase fetch failed, fallback to local', key, e);
    }
  }
  try{
    if (window.storage && window.storage.get) {
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : fallback;
    }
    const localVal = localStorage.getItem(key);
    return localVal ? JSON.parse(localVal) : fallback;
  }catch(e){ return fallback; }
}

async function storageSet(key, value){
  if (supabase) {
    try {
      await supabase.from('app_data').upsert({ key: key, value: JSON.stringify(value) });
    } catch(e) {
      console.error('Supabase set failed', key, e);
    }
  }
  try{ 
    if (window.storage && window.storage.set) {
      await window.storage.set(key, JSON.stringify(value), false); 
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  }catch(e){ console.error('storage set failed', key, e); }
}

async function loadAll(){
  const [agents, tools, requests] = await Promise.all([
    storageGet('agents', null),
    storageGet('tools', null),
    storageGet('requests', null),
  ]);
  state.agents = agents !== null ? agents : SEED_AGENTS.map(a=>({...a, id: a.matricule, fonction:'CC AE Mvola'}));
  state.tools = tools !== null ? tools : SEED_TOOLS;
  state.requests = requests !== null ? requests : [];
  if (agents === null) await storageSet('agents', state.agents);
  if (tools === null) await storageSet('tools', state.tools);
  if (requests === null) await storageSet('requests', state.requests);
  state.loaded = true;
}
async function persistAgents(){ await storageSet('agents', state.agents); }
async function persistTools(){ await storageSet('tools', state.tools); }
async function persistRequests(){ await storageSet('requests', state.requests); }

/* ---------- UTILS ---------- */
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function daysFromToday(iso){ const d=new Date(iso+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function addDays(iso, n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function toolById(id){ return state.tools.find(t=>t.id===id); }
function agentByMat(mat){ return state.agents.find(a=>a.matricule===mat); }
function initials(nom){ if(!nom) return '?'; const parts=nom.trim().split(/\s+/); return ((parts[0]?.[0]||'')+(parts[1]?.[0]||'')).toUpperCase(); }

function toast(msg, ok=true){
  const t=document.getElementById('toast');
  t.innerHTML = (ok? '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>' : '') + '<span>'+esc(msg)+'</span>';
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* Password status */
function pwStatus(dateModif){
  if(!dateModif) return {label:'Non renseigné', cls:'pw-gray', days:null};
  const exp = addDays(dateModif, 90);
  const left = daysFromToday(exp);
  if(left < 0) return {label:'Expiré', cls:'pw-red', days:left, exp};
  if(left <= 15) return {label: left+' j restants', cls:'pw-orange', days:left, exp};
  return {label: left+' j restants', cls:'pw-green', days:left, exp};
}

/* Aggregate all lignes with a flat reference back to request */
function allLignes(){
  const out=[];
  state.requests.forEach(r=>{
    (r.lignes||[]).forEach(l=>{ out.push({req:r, ligne:l}); });
  });
  return out;
}

function pendingTicketRequests(){ return state.requests.filter(r=> !r.ticketId && r.statut!=='termine'); }
function expiringPasswords(){
  return allLignes().filter(x=> x.ligne.dateModifMdp).map(x=>{
    const st = pwStatus(x.ligne.dateModifMdp);
    return {...x, st};
  }).filter(x=> x.st.cls==='pw-orange' || x.st.cls==='pw-red');
}

function openModal(contentHtml, wide=false){
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal');
  modal.className = 'modal' + (wide ? ' wide' : '');
  modal.innerHTML = contentHtml;
  overlay.classList.add('show');
  modal.querySelectorAll('[data-close]').forEach(b=> b.addEventListener('click', closeModal));
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('show');
}

  {id:'agents', label:'Agents', icon:'M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2 M9 11a4 4 0 100-8 4 4 0 000 8z M22 21v-2a4 4 0 00-3-3.87 M16 3.13a4 4 0 010 7.75'},
  {id:'newrequest', label:'Nouvelle demande', icon:'M12 5v14M5 12h14'},
  {id:'tickets', label:'Suivi tickets', icon:'M4 7h16M4 12h16M4 17h10'},
  {id:'passwords', label:'Mots de passe', icon:'M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zM8 11V7a4 4 0 118 0v4'},
  {id:'tools', label:'Outils', icon:'M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z'},
  {id:'history', label:'Historique', icon:'M3 3v5h5M3.05 13a9 9 0 106.16-8.63 M12 7v5l4 2'},
];

function renderRail(){
  const rail = document.getElementById('rail');
  const pendingCount = pendingTicketRequests().length;
  const pwCount = expiringPasswords().length;
  rail.innerHTML = `<div class="rail-logo">AH</div>` +
    NAV.map(n=>{
      let badge='';
      if(n.id==='tickets' && pendingCount>0) badge=`<span class="rail-badge">${pendingCount}</span>`;
      if(n.id==='passwords' && pwCount>0) badge=`<span class="rail-badge">${pwCount}</span>`;
      return `<button class="rail-btn ${state.view===n.id?'active':''}" data-nav="${n.id}">
        <svg viewBox="0 0 24 24">${n.icon.split(' M').map((d,i)=>`<path d="${i===0?d:'M'+d}"/>`).join('')}</svg>
        <span>${n.label}</span>${badge}
      </button>`;
    }).join('') + `<div class="rail-spacer"></div>`;
  rail.querySelectorAll('[data-nav]').forEach(b=> b.addEventListener('click', ()=> switchView(b.dataset.nav)));
}

const TITLES = {
  dashboard:['Tableau de bord',"Vue d'ensemble des accès et tickets"],
  agents:['Référentiel agents','Base centrale des agents CNTO'],
  newrequest:['Nouvelle demande','Créer une demande groupée pour un ou plusieurs agents'],
  tickets:['Suivi des tickets IT','Demandes en cours, en attente d’ID et clôturées'],
  passwords:['Mots de passe','Suivi des réinitialisations et expirations à 90 jours'],
  tools:['Catalogue des outils','Gérer les outils et types d’accès disponibles'],
  history:['Historique & analyse','Demandes finalisées et récurrence des réclamations'],
};

function switchView(view, opts={}){
  state.view = view;
  if(opts.historyAgent !== undefined) state.historyAgent = opts.historyAgent;
  document.getElementById('view-title').textContent = TITLES[view][0];
  document.getElementById('view-sub').textContent = TITLES[view][1];
  renderRail();
  renderContent();
}

function renderContent(){
  const c = document.getElementById('content');
  if(state.view==='dashboard') c.innerHTML = viewDashboard();
  else if(state.view==='agents') c.innerHTML = viewAgents();
  else if(state.view==='newrequest') c.innerHTML = viewNewRequest();
  else if(state.view==='tickets') c.innerHTML = viewTickets();
  else if(state.view==='passwords') c.innerHTML = viewPasswords();
  else if(state.view==='tools') c.innerHTML = viewTools();
  else if(state.view==='history') c.innerHTML = viewHistory();
  bindContentEvents();
}

/* =========================================================
   VIEW: DASHBOARD
   ========================================================= */
function viewDashboard(){
  const pending = pendingTicketRequests();
  const pwExp = expiringPasswords();
  const enCours = state.requests.filter(r=>r.statut==='en_cours').length;
  const termine = state.requests.filter(r=>r.statut==='termine').length;

  let html = '';
  html += `<div class="kpis">
    <div class="kpi k-amber"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <div class="kpi-num">${pending.length}</div><div class="kpi-label">En attente d'ID ticket IT</div></div>
    <div class="kpi k-red"><svg viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zM8 11V7a4 4 0 118 0v4"/></svg>
      <div class="kpi-num">${pwExp.length}</div><div class="kpi-label">Mots de passe à surveiller (≤15j)</div></div>
    <div class="kpi k-ink"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div class="kpi-num">${enCours}</div><div class="kpi-label">Demandes en cours de traitement</div></div>
    <div class="kpi k-teal"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
      <div class="kpi-num">${state.agents.length}</div><div class="kpi-label">Agents référencés</div></div>
  </div>`;

  if(pending.length){
    html += `<div class="banner banner-amber"><svg viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.7 3.86a2 2 0 00-3.4 0z"/></svg>
    <span>${pending.length} demande${pending.length>1?'s':''} sans numéro de ticket IT — pensez à les compléter dès réception du support.
    <span class="link" data-nav="tickets"> Voir le suivi des tickets →</span></span></div>`;
  }
  if(pwExp.filter(x=>x.st.cls==='pw-red').length){
    const n = pwExp.filter(x=>x.st.cls==='pw-red').length;
    html += `<div class="banner banner-red"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
    <span>${n} mot${n>1?'s':''} de passe expiré${n>1?'s':''} (>90 jours). <span class="link" data-nav="passwords"> Voir les mots de passe →</span></span></div>`;
  }

  html += `<div class="section-title"><h2>Demandes en attente d'ID ticket</h2><span class="count">${pending.length} lot(s)</span></div>`;
  html += stubGrid(pending.slice(0,6));
  if(pending.length===0) html += emptyState('Aucune demande en attente', 'Toutes les demandes ont un numéro de ticket IT renseigné.');

  html += `<div class="section-title"><h2>Mots de passe à surveiller</h2><span class="count">${pwExp.length} agent(s)</span></div>`;
  if(pwExp.length){
    html += `<div class="table-wrap card"><table><thead><tr><th>Agent</th><th>Outil</th><th>Modifié le</th><th>Expire le</th><th>Statut</th></tr></thead><tbody>`;
    pwExp.sort((a,b)=>a.st.days-b.st.days).slice(0,8).forEach(x=>{
      const a = agentByMat(x.ligne.matricule);
      const t = toolById(x.req.toolId);
      html += `<tr><td><b>${esc(a?a.nom:x.ligne.matricule)}</b><br><span class="small text-slate mono">${esc(x.ligne.matricule)}</span></td>
        <td>${esc(t?t.nom:'')}</td><td class="mono">${fmtDate(x.ligne.dateModifMdp)}</td><td class="mono">${fmtDate(x.st.exp)}</td>
        <td><span class="pw-pill ${x.st.cls}"><span class="pw-dot"></span>${x.st.label}</span></td></tr>`;
    });
    html += `</tbody></table></div>`;
  } else {
    html += emptyState('Aucun mot de passe à surveiller', "Rien n'expire dans les 15 prochains jours.");
  }

  return html;
}

function stubGrid(reqs){
  if(!reqs.length) return '';
  return `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr));margin-bottom:8px;">` +
    reqs.map(r=> stubCard(r)).join('') + `</div>`;
}

function stubCard(r){
  const t = toolById(r.toolId);
  let extra = '';
  if(!r.ticketId) extra='';
  else if(r.statut==='termine') extra='stub-teal';
  else extra='';
  const tagHtml = !r.ticketId
    ? `<span class="tag tag-amber">⏳ Sans ticket</span>`
    : r.statut==='termine' ? `<span class="tag tag-teal">✓ Terminé</span>` : `<span class="tag tag-slate">🎫 ${esc(r.ticketId)}</span>`;
  return `<div class="stub ${extra}">
    <div class="stub-head"><span class="stub-tool">${esc(t?t.nom:'Outil')}</span>${tagHtml}</div>
    <div class="stub-body"><span><b>${r.lignes.length}</b> agent(s)</span><span>Créé le <b>${fmtDate(r.dateCreation)}</b></span></div>
    <div class="stub-agents">${r.lignes.slice(0,5).map(l=>`<span class="chip">${esc((agentByMat(l.matricule)||{nom:l.matricule}).nom.split(' ')[0])} <span class="mono text-slate">${esc(l.matricule)}</span></span>`).join('')}${r.lignes.length>5?`<span class="chip">+${r.lignes.length-5}</span>`:''}</div>
    <div class="stub-perf"></div>
    <div class="stub-foot">
      <button class="btn btn-ghost btn-sm" data-open-request="${r.id}">Ouvrir</button>
      <button class="btn btn-amber btn-sm" data-copy-request="${r.id}">Copier le récap</button>
    </div>
  </div>`;
}

function emptyState(title, sub){
  return `<div class="card empty-state"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M7 20h10a2 2 0 002-2V7l-5-5H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
    <div class="es-title">${esc(title)}</div><div>${esc(sub)}</div></div>`;
}

/* =========================================================
   VIEW: AGENTS (Référentiel)
   ========================================================= */
function viewAgents(){
  let list = [...state.agents];
  const f = state.agentFilter.trim().toLowerCase();
  if(f) list = list.filter(a=> (a.nom||'').toLowerCase().includes(f) || (a.matricule||'').toLowerCase().includes(f) || (a.mail||'').toLowerCase().includes(f));
  list.sort((a,b)=> (a.nom||'').localeCompare(b.nom||''));

  let html = `<div class="toolbar">
    <div class="filter-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="agent-filter-input" placeholder="Filtrer par nom, matricule, mail…" value="${esc(state.agentFilter)}"></div>
    <span class="count text-slate small">${list.length} agent(s)</span>
    <div class="spacer"></div>
    <button class="btn btn-primary" data-action="new-agent"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Ajouter un agent</button>
  </div>`;

  if(!list.length){
    html += emptyState('Aucun agent trouvé', 'Ajustez votre recherche ou ajoutez un nouvel agent.');
    return html;
  }

  html += `<div class="table-wrap card"><table><thead><tr>
    <th>Agent</th><th>Matricule</th><th>N+1</th><th>Contact</th><th>Session</th><th>Login outils</th><th>Ancienneté</th><th></th>
  </tr></thead><tbody>`;
  list.forEach(a=>{
    html += `<tr>
      <td><div class="flex items-center gap8"><div class="agent-avatar" style="width:32px;height:32px;font-size:12px;border-radius:9px;">${esc(initials(a.nom))}</div>
      <div><b>${esc(a.nom)}</b><br><span class="small text-slate">${esc(a.mail||'—')}</span></div></div></td>
      <td class="mono">${esc(a.matricule)}</td>
      <td class="small">${esc(a.n1||'—')}</td>
      <td class="mono small">${esc(a.contact||'—')}</td>
      <td class="mono small">${esc(a.session||'—')}</td>
      <td class="mono small">${esc(a.login||'—')}</td>
      <td class="small">${esc(a.anciennete||'—')}</td>
      <td><div class="flex gap8">
        <button class="icon-btn" data-open-agent="${esc(a.matricule)}" title="Fiche agent"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        <button class="icon-btn" data-edit-agent="${esc(a.matricule)}" title="Modifier"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="icon-btn danger" data-del-agent="${esc(a.matricule)}" title="Supprimer"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg></button>
      </div></td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

  return `<div class="form-grid">
    <div class="field"><label>Matricule *</label><input id="f-matricule" value="${esc(a.matricule||'')}" ${a.matricule?'readonly style="background:var(--paper)"':''} placeholder="CN00000"></div>
    <div class="field"><label>Nom & Prénoms *</label><input id="f-nom" value="${esc(a.nom||'')}" placeholder="NOM Prénom"></div>
    <div class="field"><label>N+1</label><input id="f-n1" value="${esc(a.n1||'')}"></div>
    <div class="field"><label>Fonction</label><input id="f-fonction" value="${esc(a.fonction||'')}" placeholder="CC AE Mvola"></div>
    <div class="field"><label>Contact</label><input id="f-contact" value="${esc(a.contact||'')}" placeholder="034 00 000 00"></div>
    <div class="field"><label>Session Windows</label><input id="f-session" value="${esc(a.session||'')}"></div>
    <div class="field"><label>Login outils (IAS/YAS)</label><input id="f-login" value="${esc(a.login||'')}"></div>
    <div class="field"><label>Ancienneté</label><input id="f-anciennete" value="${esc(a.anciennete||'')}" placeholder="ex: 2 ans 3 mois"></div>
    <div class="field"><label>Mail agent</label><input id="f-mail" value="${esc(a.mail||'')}" placeholder="prenom.nom@connecteo.mg"></div>
    <div class="field"><label>Mail N+1</label><input id="f-mailN1" value="${esc(a.mailN1||'')}"></div>
    <div class="field"><label>Hermes</label><input id="f-hermes" value="${esc(a.hermes||'')}"></div>
    <div class="field"><label>Amdocs</label><input id="f-amdocs" value="${esc(a.amdocs||'')}"></div>
  </div>`;
}

function openAgentModal(matricule){
  const a = matricule ? agentByMat(matricule) : {};
  openModal(`
    <div class="modal-head"><h3>${matricule?'Modifier cet agent':'Ajouter un agent'}</h3><button class="modal-close" data-close><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">${agentFormFields(a)}</div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-primary" id="save-agent-btn">Enregistrer</button></div>
  `);
  document.getElementById('save-agent-btn').addEventListener('click', async ()=>{
    const matVal = document.getElementById('f-matricule').value.trim();
    const nomVal = document.getElementById('f-nom').value.trim();
    if(!matVal || !nomVal){ toast('Matricule et nom sont obligatoires', false); return; }
    const data = {
      matricule: matVal, id: matVal, nom: nomVal,
      n1: document.getElementById('f-n1').value.trim(),
      fonction: document.getElementById('f-fonction').value.trim(),
      contact: document.getElementById('f-contact').value.trim(),
      session: document.getElementById('f-session').value.trim(),
      login: document.getElementById('f-login').value.trim(),
      anciennete: document.getElementById('f-anciennete').value.trim(),
      mail: document.getElementById('f-mail').value.trim(),
      mailN1: document.getElementById('f-mailN1').value.trim(),
      hermes: document.getElementById('f-hermes').value.trim(),
      amdocs: document.getElementById('f-amdocs').value.trim(),
    };
    if(matricule){
      const idx = state.agents.findIndex(x=>x.matricule===matricule);
      state.agents[idx] = data;
    } else {
      if(agentByMat(matVal)){ toast('Ce matricule existe déjà', false); return; }
      state.agents.push(data);
    }
    await persistAgents();
    closeModal();
    toast(matricule?'Agent mis à jour':'Agent ajouté');
    renderContent();
  });
}

function openAgentDetail(matricule){
  const a = agentByMat(matricule);
  if(!a) return;
  const lignes = allLignes().filter(x=>x.ligne.matricule===matricule).sort((x,y)=> new Date(y.req.dateCreation)-new Date(x.req.dateCreation));
  const causeAgent = lignes.filter(x=>x.ligne.causeType==='agent').length;
  const causeOutil = lignes.filter(x=>x.ligne.causeType==='outil').length;
  let html = `<div class="agent-hero">
    <div class="agent-avatar">${esc(initials(a.nom))}</div>
    <div class="agent-hero-info"><h2>${esc(a.nom)}</h2>
      <div class="mono">${esc(a.matricule)} · ${esc(a.fonction||'—')}</div>
      <div>${esc(a.mail||'—')} · ${esc(a.contact||'—')} · N+1 : ${esc(a.n1||'—')}</div>
    </div>
  </div>
  <div class="cause-bars">
    <div class="cause-bar"><div class="cb-num">${lignes.length}</div><div class="cb-label">Demandes historiques (tous outils)</div></div>
    <div class="cause-bar"><div class="cb-num text-amber">${causeAgent}</div><div class="cb-label">Cause Agent (erreur / manipulation)</div></div>
    <div class="cause-bar"><div class="cb-num text-red">${causeOutil}</div><div class="cb-label">Cause Outil (dysfonctionnement récurrent)</div></div>
  </div>`;

  if(lignes.length){
    html += `<div class="table-wrap card"><table><thead><tr><th>Date</th><th>Outil</th><th>Ticket</th><th>Statut</th><th>Commentaire</th><th>Analyse cause</th></tr></thead><tbody>`;
    lignes.forEach(x=>{
      const t = toolById(x.req.toolId);
      html += `<tr><td class="mono small">${fmtDate(x.req.dateCreation)}</td><td>${esc(t?t.nom:'')}</td>
        <td class="mono">${esc(x.req.ticketId||'—')}</td>
        <td>${statutTag(x.req.statut, x.req.ticketId)}</td>
        <td class="small">${esc(x.ligne.commentaire||'—')}</td>
        <td><select class="filter-select" data-cause="${x.req.id}|${x.ligne.id}">
          <option value="" ${!x.ligne.causeType?'selected':''}>—</option>
          <option value="agent" ${x.ligne.causeType==='agent'?'selected':''}>Cause Agent</option>
          <option value="outil" ${x.ligne.causeType==='outil'?'selected':''}>Cause Outil</option>
        </select></td></tr>`;
    });
    html += `</tbody></table></div>`;
  } else {
    html += emptyState('Aucun historique', "Cet agent n'a pas encore de demande enregistrée.");
  }

  openModal(`<div class="modal-head"><h3>Fiche agent</h3><button class="modal-close" data-close><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="modal-body">${html}</div>
  <div class="modal-foot"><button class="btn btn-ghost" data-close>Fermer</button></div>`, true);

  document.querySelectorAll('[data-cause]').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const [reqId, ligneId] = sel.dataset.cause.split('|');
      const req = state.requests.find(r=>r.id===reqId);
      const l = req.lignes.find(l=>l.id===ligneId);
      l.causeType = sel.value;
      await persistRequests();
      toast('Analyse enregistrée');
    });
  });
}

function statutTag(statut, ticketId){
  if(!ticketId) return `<span class="tag tag-amber">Sans ticket</span>`;
  if(statut==='termine') return `<span class="tag tag-teal">Terminé</span>`;
  return `<span class="tag tag-slate">En cours</span>`;
}

/* =========================================================
   VIEW: NOUVELLE DEMANDE
   ========================================================= */
function viewNewRequest(){
  const tool = state.newReqTool ? toolById(state.newReqTool) : null;
  let html = `<div class="card" style="padding:22px;">
    <div class="field"><label>1. Choisir l'outil / type d'accès concerné</label>
      <select id="nr-tool" class="w-full">
        <option value="">— Sélectionner un outil —</option>
        ${state.tools.map(t=>`<option value="${t.id}" ${state.newReqTool===t.id?'selected':''}>${esc(t.nom)}</option>`).join('')}
      </select>
    </div>`;

  if(tool){
    html += `<div class="field"><label>2. Sélectionner un ou plusieurs agents</label>
      <div class="agent-picker">
        <div class="ap-search field" style="margin-bottom:8px;"><input id="ap-search" placeholder="Rechercher un agent…"></div>
        <div id="ap-list"></div>
      </div>
      <div class="selected-chips" id="selected-chips"></div>
    </div>`;

    if(state.newReqSelected.length){
      html += `<div class="field"><label>3. Renseigner les informations par agent</label></div>
      <div class="table-wrap" style="margin-bottom:14px;"><table><thead><tr>
        <th>Agent</th>${tool.champs.map(c=>`<th>${esc(c.label)}</th>`).join('')}<th>Commentaire</th>
      </tr></thead><tbody>`;
      state.newReqSelected.forEach(mat=>{
        const a = agentByMat(mat);
        html += `<tr><td><b>${esc(a?a.nom:mat)}</b><br><span class="small mono text-slate">${esc(mat)}</span></td>
          ${tool.champs.map(c=>`<td><input class="nr-champ" data-mat="${esc(mat)}" data-key="${c.key}" placeholder="${esc(c.label)}" style="width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--border);"></td>`).join('')}
          <td><input class="nr-comment" data-mat="${esc(mat)}" placeholder="Commentaire (optionnel)" style="width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--border);"></td></tr>`;
      });
      html += `</tbody></table></div>
      <div class="field"><label>Commentaire global (optionnel — s'ajoutera à toutes les lignes)</label>
        <textarea id="nr-global-comment" placeholder="ex: Merci de traiter en urgence, prise de poste demain"></textarea></div>
      <button class="btn btn-amber" id="create-request-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Générer la demande & le tableau récap</button>`;
    }
  }
  html += `</div>`;

  if(tool && state.lastGeneratedRequest){
    html += renderRecapBlock(state.lastGeneratedRequest);
  }
  return html;
}

function renderRecapBlock(req){
  const t = toolById(req.toolId);
  let rows = req.lignes.map(l=>{
    const a = agentByMat(l.matricule) || {};
    const loginConcerne = t.champs.map(c=> l.valeurs[c.key]).filter(Boolean).join(' / ') || '—';
    return `<tr><td>${esc(l.matricule)}</td><td>${esc(a.nom||'')}</td><td>${esc(a.contact||'')}</td><td>${esc(a.fonction||'')}</td><td>${esc(loginConcerne)}</td><td>${esc(a.mailN1||'')}</td><td>${esc(l.commentaire||'')}</td></tr>`;
  }).join('');

  return `<div class="section-title"><h2>Récapitulatif généré — ${esc(t.nom)}</h2><span class="tag tag-amber">Statut : En attente ID IT</span></div>
  <div class="card" style="padding:18px;">
    <div class="table-wrap">${tableHtml}</div>
    <div class="flex gap8" style="margin-top:14px;">
      <button class="btn btn-primary" data-copy-request="${req.id}"><svg viewBox="0 0 24 24"><path d="M8 16H6a2 2 0 01-2-2V4a2 2 0 012-2h10a2 2 0 012 2v2M10 8h10a2 2 0 012 2v10a2 2 0 01-2 2H10a2 2 0 01-2-2V10a2 2 0 012-2z"/></svg> Copier le tableau (pour email)</button>
      <button class="btn btn-ghost" data-nav="tickets">Aller au suivi des tickets</button>
    </div>
    <p class="small text-slate" style="margin-top:10px;">Collez ce tableau directement dans votre logiciel de messagerie. Aucun mail n'est envoyé automatiquement — vous gardez la main sur l'envoi.</p>
  </div>`;

function renderApList(filterText=''){
  const box = document.getElementById('ap-list');
  if(!box) return;
  const f = filterText.trim().toLowerCase();
  let list = state.agents.filter(a=> !f || (a.nom||'').toLowerCase().includes(f) || (a.matricule||'').toLowerCase().includes(f));
  list.sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
  box.innerHTML = list.slice(0,60).map(a=>`<label class="ap-row"><input type="checkbox" value="${esc(a.matricule)}" ${state.newReqSelected.includes(a.matricule)?'checked':''}>
    <div><div class="ap-name">${esc(a.nom)}</div><div class="ap-mat">${esc(a.matricule)} · ${esc(a.fonction||'')}</div></div></label>`).join('') || '<div class="small text-slate" style="padding:10px;">Aucun agent trouvé</div>';
  box.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) state.newReqSelected.push(cb.value);
      else state.newReqSelected = state.newReqSelected.filter(m=>m!==cb.value);
      renderContent();
    });
  });
}
function renderSelectedChips(){
  const box = document.getElementById('selected-chips');
  if(!box) return;
  box.innerHTML = state.newReqSelected.map(mat=>{
    const a = agentByMat(mat);
    return `<span class="chip">${esc(a?a.nom:mat)} <button data-unselect="${esc(mat)}">✕</button></span>`;
  }).join('');
  box.querySelectorAll('[data-unselect]').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.newReqSelected = state.newReqSelected.filter(m=>m!==b.dataset.unselect);
      renderContent();
    });
  });
}

function viewTickets(){

function openRequestModal(reqId){

  const t = toolById(req.toolId);
  let rows = req.lignes.map(l=>{
    const a = agentByMat(l.matricule)||{};
    const vals = t.champs.map(c=> l.valeurs[c.key]).filter(Boolean).join(' / ') || '—';
    return `<tr><td class="mono">${esc(l.matricule)}</td><td>${esc(a.nom||'')}</td><td>${esc(vals)}</td>
      <td><input class="rl-mdp" data-req="${req.id}" data-ligne="${l.id}" value="${esc(l.motDePasse||'')}" placeholder="mot de passe" style="width:120px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);"></td>

  }).join('');

  const body = `
    <div class="field"><label>Outil</label><input value="${esc(t?t.nom:'')}" disabled></div>
    <div class="form-grid">
      <div class="field"><label>ID Ticket IT</label><input id="req-ticket" value="${esc(req.ticketId||'')}" placeholder="ex: RITM0068828 / REQ0068848"></div>
      <div class="field"><label>Statut</label><select id="req-statut">
        <option value="en_cours" ${req.statut==='en_cours'?'selected':''}>En cours</option>
        <option value="termine" ${req.statut==='termine'?'selected':''}>Terminé</option>
      </select></div>
    </div>
    <div class="field"><label>Commentaire global</label><textarea id="req-comment">${esc(req.commentaireGlobal||'')}</textarea></div>
    <div class="field"><label>Agents du lot — mot de passe & date de modification (si applicable)</label></div>
    <div class="table-wrap"><table><thead><tr><th>Matricule</th><th>Nom</th><th>Valeur(s)</th><th>Mot de passe</th><th>Modifié le</th><th>Commentaire</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="field-hint" style="margin-top:8px;">L'ID de ticket saisi ci-dessus s'appliquera à l'ensemble des agents de ce lot.</p>
  `;
  openModal(`<div class="modal-head"><h3>Demande — ${esc(t?t.nom:'')}</h3><button class="modal-close" data-close><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="modal-body">${body}</div>
  <div class="modal-foot">
    <button class="btn btn-red btn-sm" id="del-req-btn">Supprimer le lot</button>
    <div class="spacer"></div>
    <button class="btn btn-ghost" data-close>Annuler</button>
    <button class="btn btn-primary" id="save-req-btn">Enregistrer</button>
  </div>`, true);

  document.getElementById('del-req-btn').addEventListener('click', async ()=>{
    if(!confirm('Voulez-vous supprimer définitivement ce lot de demandes ?')) return;
    state.requests = state.requests.filter(r=>r.id!==reqId);
    await persistRequests();
    closeModal();
    toast('Lot supprimé');
    renderContent();
  });

  document.getElementById('save-req-btn').addEventListener('click', async ()=>{
    req.ticketId = document.getElementById('req-ticket').value.trim();
    req.statut = document.getElementById('req-statut').value;
    req.commentaireGlobal = document.getElementById('req-comment').value.trim();

    document.querySelectorAll('.rl-mdp').forEach(inp=>{
      const l = req.lignes.find(x=>x.id===inp.dataset.ligne);
      if(l) l.motDePasse = inp.value.trim();
    });
    document.querySelectorAll('.rl-date').forEach(inp=>{
      const l = req.lignes.find(x=>x.id===inp.dataset.ligne);
      if(l) l.dateModifMdp = inp.value;
    });
    document.querySelectorAll('.rl-comment').forEach(inp=>{
      const l = req.lignes.find(x=>x.id===inp.dataset.ligne);
      if(l) l.commentaire = inp.value.trim();
    });

    await persistRequests();
    closeModal();
    toast('Demande mise à jour');
    renderContent();
  });
}

function openToolModal(toolId){
  const t = toolId ? toolById(toolId) : {id:uid(), nom:'', champs:[{key:'login',label:'Login'}]};
  let champsHtml = (t.champs||[]).map((c,i)=>`
    <div class="flex gap8 items-center tool-champ-row" style="margin-bottom:6px;">
      <input class="tc-label" value="${esc(c.label)}" placeholder="Nom du champ (ex: Login S3)" style="flex:1;padding:7px 9px;border-radius:7px;border:1px solid var(--border);">
      <button class="icon-btn danger del-tc-btn"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
  `).join('');

  const body = `
    <div class="field"><label>Nom de l'outil *</label><input id="t-nom" value="${esc(t.nom)}" placeholder="ex: Application CRM"></div>
    <div class="field"><label>Couleur d'identification</label><input type="color" id="t-couleur" value="${t.couleur||'#E8A33D'}" style="height:40px;padding:2px;"></div>
    <div class="field"><label>Champs d'accès requis</label>
      <div id="tc-container">${champsHtml}</div>
      <button class="btn btn-ghost btn-sm" id="add-tc-btn" style="margin-top:6px;">+ Ajouter un champ</button>
    </div>
  `;

  openModal(`<div class="modal-head"><h3>${toolId?'Modifier l\'outil':'Ajouter un outil'}</h3><button class="modal-close" data-close><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
  <div class="modal-body">${body}</div>
  <div class="modal-foot"><button class="btn btn-ghost" data-close>Annuler</button><button class="btn btn-primary" id="save-tool-btn">Enregistrer</button></div>`);

  document.getElementById('add-tc-btn').addEventListener('click', ()=>{
    const div = document.createElement('div');
    div.className = 'flex gap8 items-center tool-champ-row';
    div.style.marginBottom = '6px';
    div.innerHTML = `<input class="tc-label" placeholder="Nom du champ" style="flex:1;padding:7px 9px;border-radius:7px;border:1px solid var(--border);">
      <button class="icon-btn danger del-tc-btn"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
    document.getElementById('tc-container').appendChild(div);
    div.querySelector('.del-tc-btn').addEventListener('click', ()=> div.remove());
  });

  document.querySelectorAll('.del-tc-btn').forEach(b=> b.addEventListener('click', e=> e.target.closest('.tool-champ-row').remove()));

  document.getElementById('save-tool-btn').addEventListener('click', async ()=>{
    const nom = document.getElementById('t-nom').value.trim();
    if(!nom){ toast('Le nom de l\'outil est requis', false); return; }
    const champs = [];
    document.querySelectorAll('.tool-champ-row').forEach((row, i)=>{
      const lbl = row.querySelector('.tc-label').value.trim();
      if(lbl) champs.push({key: 'k'+i+'_'+lbl.toLowerCase().replace(/[^a-z0-9]/g,''), label: lbl});
    });
    if(!champs.length) champs.push({key:'login', label:'Login'});

    const toolData = { id: t.id, nom, couleur: document.getElementById('t-couleur').value, champs, gerePassword: true };

    if(toolId){
      const idx = state.tools.findIndex(x=>x.id===toolId);
      state.tools[idx] = toolData;
    } else {
      state.tools.push(toolData);
    }
    await persistTools();
    closeModal();
    toast(toolId?'Outil mis à jour':'Outil ajouté');
    renderContent();
  });
}

/* =========================================================
   VIEW: HISTORIQUE & ANALYSE CAUSE
   ========================================================= */
function viewHistory(){
  const all = allLignes();
  const agentsWithReqs = state.agents.map(a=>{
    const reqs = all.filter(x=>x.ligne.matricule===a.matricule);
    const agentCauses = reqs.filter(x=>x.ligne.causeType==='agent').length;
    const outilCauses = reqs.filter(x=>x.ligne.causeType==='outil').length;
    return { agent: a, total: reqs.length, agentCauses, outilCauses };
  }).filter(x=> x.total > 0);

  agentsWithReqs.sort((a,b)=> b.total - a.total);

  let html = `<div class="toolbar">
    <span class="count text-slate small">${agentsWithReqs.length} agent(s) ayant des demandes enregistrées</span>
  </div>`;

  if(!agentsWithReqs.length){ html += emptyState('Aucun historique à analyser', 'Les réclamations et demandes créées apparaîtront ici.'); return html; }

  html += `<div class="table-wrap card"><table><thead><tr>
    <th>Agent</th><th>Nombre total de demandes</th><th>Cause Agent (erreur)</th><th>Cause Outil (panne/blocage)</th><th>Action</th>
  </tr></thead><tbody>`;

  agentsWithReqs.forEach(x=>{
    html += `<tr>
      <td><b>${esc(x.agent.nom)}</b><br><span class="small text-slate mono">${esc(x.agent.matricule)}</span></td>
      <td><b>${x.total}</b> demande(s)</td>
      <td><span class="text-amber font-weight:700">${x.agentCauses}</span></td>
      <td><span class="text-red font-weight:700">${x.outilCauses}</span></td>
      <td><button class="btn btn-ghost btn-sm" data-open-agent="${esc(x.agent.matricule)}">Voir le détail</button></td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
  return html;
}

/* =========================================================
   EVENT BINDING
   ========================================================= */
function bindContentEvents(){
  // Navigation links in banners
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.addEventListener('click', ()=> switchView(b.dataset.nav));
  });

  // Copy recap
  document.querySelectorAll('[data-copy-request]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const reqId = b.dataset.copy-request;
      const tbl = document.getElementById(`recap-table-${reqId}`);
      if(tbl){
        const range = document.createRange();
        range.selectNode(tbl);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand('copy');
        window.getSelection().removeAllRanges();
        toast('Tableau copié dans le presse-papier !');
      } else {
        toast('Veuillez ouvrir le lot pour voir le tableau', false);
      }
    });
  });

  // Request modals
  document.querySelectorAll('[data-open-request]').forEach(b=>{
    b.addEventListener('click', ()=> openRequestModal(b.dataset.openRequest));
  });

  // Agent modals & details
  document.querySelectorAll('[data-open-agent]').forEach(b=>{
    b.addEventListener('click', ()=> openAgentDetail(b.dataset.openAgent));
  });
  document.querySelectorAll('[data-edit-agent]').forEach(b=>{
    b.addEventListener('click', ()=> openAgentModal(b.dataset.editAgent));
  });
  document.querySelectorAll('[data-del-agent]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(confirm('Supprimer cet agent du référentiel ?')){
        state.agents = state.agents.filter(a=>a.matricule!==b.dataset.delAgent);
        await persistAgents();
        toast('Agent supprimé');
        renderContent();
      }
    });
  });

  const btnNewAgent = document.querySelector('[data-action="new-agent"]');
  if(btnNewAgent) btnNewAgent.addEventListener('click', ()=> openAgentModal());

  // Agent Filter input
  const agentFilterInput = document.getElementById('agent-filter-input');
  if(agentFilterInput){
    agentFilterInput.addEventListener('input', e=>{
      state.agentFilter = e.target.value;
      renderContent();
      document.getElementById('agent-filter-input').focus();
    });
  }

  // New Request Tool Select
  const nrTool = document.getElementById('nr-tool');
  if(nrTool){
    nrTool.addEventListener('change', e=>{
      state.newReqTool = e.target.value;
      state.newReqSelected = [];
      state.lastGeneratedRequest = null;
      renderContent();
    });
  }

  if(state.view==='newrequest' && state.newReqTool){
    renderApList();
    renderSelectedChips();

    const apSearch = document.getElementById('ap-search');
    if(apSearch) apSearch.addEventListener('input', e=> renderApList(e.target.value));

    const createBtn = document.getElementById('create-request-btn');
    if(createBtn){
      createBtn.addEventListener('click', async ()=>{
        const tool = toolById(state.newReqTool);
        const globalComment = (document.getElementById('nr-global-comment')?.value||'').trim();

        const lignes = state.newReqSelected.map(mat=>{
          const valeurs = {};
          tool.champs.forEach(c=>{
            const inp = document.querySelector(`.nr-champ[data-mat="${mat}"][data-key="${c.key}"]`);
            if(inp) valeurs[c.key] = inp.value.trim();
          });
          const commentInp = document.querySelector(`.nr-comment[data-mat="${mat}"]`);
          const lineComment = commentInp ? commentInp.value.trim() : '';
          const fullComment = [lineComment, globalComment].filter(Boolean).join(' — ');

          return {
            id: uid(),
            matricule: mat,
            valeurs,
            commentaire: fullComment,
            motDePasse: '',
            dateModifMdp: '',
            causeType: ''
          };
        });

        const req = {
          id: uid(),
          toolId: tool.id,
          dateCreation: todayISO(),
          ticketId: '',
          statut: 'en_cours',
          commentaireGlobal: globalComment,
          lignes
        };

        state.requests.unshift(req);
        state.lastGeneratedRequest = req;
        await persistRequests();
        toast('Demande générée avec succès');
        renderContent();
      });
    }
  }

  // Ticket Filters
  const ticketFilter = document.getElementById('ticket-filter');
  if(ticketFilter) ticketFilter.addEventListener('change', e=>{ state.ticketFilter = e.target.value; renderContent(); });

  const ticketToolFilter = document.getElementById('ticket-tool-filter');
  if(ticketToolFilter) ticketToolFilter.addEventListener('change', e=>{ state.ticketToolFilter = e.target.value; renderContent(); });

  // Password Filter
  const pwFilter = document.getElementById('pw-filter');
  if(pwFilter) pwFilter.addEventListener('change', e=>{ state.pwFilter = e.target.value; renderContent(); });

  // Reinit Password quick action
  document.querySelectorAll('[data-reinit-pw]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const [reqId, ligneId] = b.dataset.reinitPw.split('|');
      const req = state.requests.find(r=>r.id===reqId);
      const l = req ? req.lignes.find(x=>x.id===ligneId) : null;
      if(l){
        l.dateModifMdp = todayISO();
        await persistRequests();
        toast('Mot de passe marqué réinitialisé aujourd\'hui');
        renderContent();
      }
    });
  });

  // Tool management
  const addToolBtn = document.getElementById('add-tool-btn');
  if(addToolBtn) addToolBtn.addEventListener('click', ()=> openToolModal());

  document.querySelectorAll('[data-edit-tool]').forEach(b=>{
    b.addEventListener('click', ()=> openToolModal(b.dataset.editTool));
  });
  document.querySelectorAll('[data-del-tool]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(confirm('Supprimer cet outil ?')){
        state.tools = state.tools.filter(t=>t.id!==b.dataset.delTool);
        await persistTools();
        toast('Outil supprimé');
        renderContent();
      }
    });
  });
}

/* ---------- GLOBAL SEARCH ---------- */
function setupGlobalSearch(){
  const inp = document.getElementById('global-search');
  const res = document.getElementById('search-results');
  if(!inp || !res) return;

  inp.addEventListener('input', ()=>{
    const q = inp.value.trim().toLowerCase();
    if(!q){ res.classList.remove('show'); return; }

    const matches = state.agents.filter(a=> (a.nom||'').toLowerCase().includes(q) || (a.matricule||'').toLowerCase().includes(q)).slice(0,8);

    if(!matches.length){
      res.innerHTML = `<div class="sr-item"><div class="sr-meta">Aucun résultat</div></div>`;
    } else {
      res.innerHTML = matches.map(a=>`
        <div class="sr-item" data-search-mat="${esc(a.matricule)}">
          <div class="sr-name">${esc(a.nom)}</div>
          <div class="sr-meta">${esc(a.matricule)} · N+1: ${esc(a.n1||'—')}</div>
        </div>
      `).join('');

      res.querySelectorAll('[data-search-mat]').forEach(el=>{
        el.addEventListener('click', ()=>{
          openAgentDetail(el.dataset.searchMat);
          res.classList.remove('show');
          inp.value = '';
        });
      });
    }
    res.classList.add('show');
  });

  document.addEventListener('click', e=>{
    if(!inp.contains(e.target) && !res.contains(e.target)) res.classList.remove('show');
  });
}

/* ---------- INIT APP ---------- */
async function init(){
  await loadAll();
  renderRail();
  renderContent();
  setupGlobalSearch();
}

window.addEventListener('DOMContentLoaded', init);
</script>
